<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiClear - AI Legal Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-indigo-900 text-white py-4 px-6 shadow-md">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-bold tracking-tight">LexiClear</span>
        <span class="text-xs bg-indigo-700 uppercase tracking-widest px-2 py-0.5 rounded font-mono">AI Legal Assistant</span>
      </div>
      <p class="text-xs text-indigo-200 hidden sm:block">Democratizing Legal Clarity</p>
    </div>
  </header>

  <div class="bg-amber-100 border-b border-amber-300 text-amber-900 text-xs px-6 py-2 text-center">
    <strong>Notice:</strong> LexiClear provides informational summaries and analysis. It is not licensed legal advice and does not replace an attorney.
  </div>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <!-- Tabs -->
    <div class="flex space-x-2 border-b border-slate-200">
      <button onclick="switchTab('analyze')" id="tab-analyze" class="py-2 px-4 border-b-2 font-medium text-sm border-indigo-600 text-indigo-600">Analyze Document</button>
      <button onclick="switchTab('compare')" id="tab-compare" class="py-2 px-4 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700">Compare Clauses</button>
      <button onclick="switchTab('ask')" id="tab-ask" class="py-2 px-4 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700">Q&A Chat</button>
    </div>

    <!-- Section 1: Analyze -->
    <section id="panel-analyze" class="space-y-4">
      <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-3">
        <label class="block text-sm font-semibold text-slate-700">Paste Legal Document / Contract / Agreement:</label>
        <textarea id="docInput" rows="7" class="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none text-sm font-mono" placeholder="Paste tenancy agreement, NDA, Terms of Service, or employment clause here..."></textarea>
        <button onclick="runAnalysis()" id="btnAnalyze" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded text-sm transition">Analyze Document</button>
      </div>

      <div id="analyzeOutput" class="hidden space-y-4"></div>
    </section>

    <!-- Section 2: Compare -->
    <section id="panel-compare" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Baseline / Document A:</label>
            <textarea id="docA" rows="6" class="w-full p-3 border border-slate-300 rounded text-sm font-mono" placeholder="Standard clause or original contract..."></textarea>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1">Proposed / Document B:</label>
            <textarea id="docB" rows="6" class="w-full p-3 border border-slate-300 rounded text-sm font-mono" placeholder="Counter-offer or modified clause..."></textarea>
          </div>
        </div>
        <button onclick="runComparison()" id="btnCompare" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded text-sm">Compare Contracts</button>
      </div>
      <div id="compareOutput" class="hidden space-y-4"></div>
    </section>

    <!-- Section 3: Q&A -->
    <section id="panel-ask" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-3">
        <label class="block text-sm font-semibold text-slate-700">Source Document:</label>
        <textarea id="qaDoc" rows="4" class="w-full p-3 border border-slate-300 rounded text-sm font-mono" placeholder="Paste document for context..."></textarea>
        <label class="block text-sm font-semibold text-slate-700">Your Question:</label>
        <input type="text" id="qaQuestion" class="w-full p-3 border border-slate-300 rounded text-sm" placeholder="e.g. Can I terminate early without paying a penalty?">
        <button onclick="runQA()" id="btnQA" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded text-sm">Get Answer</button>
      </div>
      <div id="qaOutput" class="hidden bg-white p-5 rounded border border-slate-200 text-sm"></div>
    </section>
  </main>

  <script>
    function switchTab(tab) {
      ['analyze', 'compare', 'ask'].forEach(t => {
        document.getElementById(`panel-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = 'py-2 px-4 border-b-2 font-medium text-sm border-indigo-600 text-indigo-600';
        } else {
          btn.className = 'py-2 px-4 border-b-2 font-medium text-sm border-transparent text-slate-500 hover:text-slate-700';
        }
      });
    }

    async function runAnalysis() {
      const text = document.getElementById('docInput').value.trim();
      if (!text) return alert('Please paste document text first.');
      const out = document.getElementById('analyzeOutput');
      out.classList.remove('hidden');
      out.innerHTML = '<p class="text-sm text-slate-500 italic">Analyzing clauses and risk profiles...</p>';

      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ document_text: text })
      });
      const resp = await res.json();
      if (resp.status !== 'success') {
        out.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded">${resp.detail || 'Analysis error'}</div>`;
        return;
      }
      const d = resp.data;
      out.innerHTML = `
        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4">
          <div>
            <h3 class="text-lg font-bold text-slate-800">Executive Summary</h3>
            <p class="text-sm text-slate-600 mt-1">${d.summary}</p>
            <span class="inline-block mt-2 text-xs font-semibold bg-slate-100 text-slate-700 px-2 py-1 rounded">Complexity: ${d.reading_level}</span>
          </div>

          <div>
            <h4 class="font-semibold text-slate-800 text-sm">Identified Risks & Red Flags</h4>
            <div class="grid gap-2 mt-2">
              ${d.risks_and_flags.map(r => `
                <div class="p-3 rounded border text-xs ${r.risk_level === 'High' ? 'bg-red-50 border-red-200 text-red-900' : r.risk_level === 'Medium' ? 'bg-amber-50 border-amber-200 text-amber-900' : 'bg-green-50 border-green-200 text-green-900'}">
                  <div class="font-bold flex justify-between">
                    <span>${r.clause_name}</span>
                    <span class="uppercase tracking-wide">${r.risk_level} Risk</span>
                  </div>
                  <p class="mt-1">${r.explanation}</p>
                  <blockquote class="mt-1 pl-2 border-l-2 italic text-slate-600">"${r.quote}"</blockquote>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-4 bg-slate-50 rounded border border-slate-200">
              <h4 class="font-semibold text-slate-800 text-xs uppercase tracking-wide">Key Obligations</h4>
              <ul class="list-disc list-inside mt-2 text-xs space-y-1 text-slate-700">
                ${d.key_obligations.map(o => `<li>${o}</li>`).join('')}
              </ul>
            </div>
            <div class="p-4 bg-slate-50 rounded border border-slate-200">
              <h4 class="font-semibold text-slate-800 text-xs uppercase tracking-wide">Questions for Legal Counsel</h4>
              <ul class="list-disc list-inside mt-2 text-xs space-y-1 text-slate-700">
                ${d.questions_for_lawyer.map(q => `<li>${q}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>
      `;
    }

    async function runComparison() {
      const a = document.getElementById('docA').value.trim();
      const b = document.getElementById('docB').value.trim();
      if (!a || !b) return alert('Please enter both documents/clauses.');
      const out = document.getElementById('compareOutput');
      out.classList.remove('hidden');
      out.innerHTML = '<p class="text-sm text-slate-500 italic">Comparing documents...</p>';

      const res = await fetch('/api/compare', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ doc_a: a, doc_b: b })
      });
      const resp = await res.json();
      const d = resp.data;
      out.innerHTML = `
        <div class="bg-white p-5 rounded-lg border border-slate-200 shadow-sm space-y-4 text-sm">
          <div class="p-3 bg-indigo-50 border border-indigo-200 rounded text-indigo-900 font-medium">
            Overall Assessment: ${d.favorable_to}
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs border border-slate-200">
              <thead class="bg-slate-100 border-b">
                <tr><th class="p-2">Clause / Aspect</th><th class="p-2">Document A</th><th class="p-2">Document B</th><th class="p-2">Analysis</th></tr>
              </thead>
              <tbody>
                ${d.key_differences.map(item => `
                  <tr class="border-b">
                    <td class="p-2 font-semibold">${item.aspect}</td>
                    <td class="p-2">${item.doc_a_position}</td>
                    <td class="p-2">${item.doc_b_position}</td>
                    <td class="p-2 text-slate-600">${item.impact}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    async function runQA() {
      const doc = document.getElementById('qaDoc').value.trim();
      const q = document.getElementById('qaQuestion').value.trim();
      if (!doc || !q) return alert('Enter both document context and your question.');
      const out = document.getElementById('qaOutput');
      out.classList.remove('hidden');
      out.innerHTML = '<p class="text-slate-500 italic">Finding answer...</p>';

      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ document_text: doc, question: q })
      });
      const resp = await res.json();
      out.innerHTML = `<div class="whitespace-pre-line text-slate-800">${resp.answer}</div>`;
    }
  </script>
</body>
</html>
